# Runs the Kronos backtest on GitHub-hosted runners (Hugging Face access is
# needed for the weights). Edit ci/kronos_plan.json and push to start a run;
# merged predictions are committed back to the same branch under results/.
name: kronos

on:
  push:
    paths:
      - ci/kronos_plan.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kronos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("ci/kronos_plan.json"))
          inc = [dict(r, shard=s) for r in plan["runs"] for s in range(r["nshards"])]
          print("matrix=" + json.dumps({"include": inc}))
          print("tag=" + plan.get("tag", ""))
          PY

  backtest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.model }} ${{ matrix.split }} ${{ matrix.shard }}/${{ matrix.nshards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy pandas einops huggingface_hub safetensors tqdm
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git
          echo "Kronos commit: $(git -C Kronos rev-parse HEAD)"
          nproc; lscpu | grep -E "Model name|Flags" | cut -c1-200
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-${{ matrix.model }}
      - name: Check fast sampler against the reference
        run: KRONOS_PATH=Kronos python tests/test_kronos_fast.py
      - name: Backtest
        run: |
          python scripts/run_kronos.py --model ${{ matrix.model }} --split ${{ matrix.split }} \
            --samples ${{ matrix.samples }} --shard ${{ matrix.shard }} --nshards ${{ matrix.nshards }} \
            --limit ${{ matrix.limit || 0 }} --batch 16 --kronos-path Kronos --verify
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.model }}-${{ matrix.split }}-${{ matrix.shard }}
          path: results/kronos_shards/*.npz

  merge:
    needs: [plan, backtest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: results/kronos_shards
          merge-multiple: true
      - name: Merge and commit
        run: |
          python scripts/merge_kronos.py --tag "${{ needs.plan.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/preds_kronos_* results/samples_kronos_*
          git commit -m "Kronos backtest results (${{ needs.plan.outputs.tag }}) [skip ci]" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
